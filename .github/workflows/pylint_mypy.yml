name: Python Linting and Type Checking

on:
  push:
    branches:
      - gk101_estimator_demo_tool
  pull_request:
    branches:
      - gk101_estimator_demo_tool

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Pylint
        run: |
          pylint margin_estimator_tool/src/.

      - name: Run Mypy
        run: |
          mypy margin_estimator_tool/src/.
