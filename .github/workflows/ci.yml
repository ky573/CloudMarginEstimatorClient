name: CI Pipeline

on:
  push:
    branches:
      - gk101_estimator_demo_tool_update
  pull_request:
    branches:
      - gk101_estimator_demo_tool_update

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python 3.10
        uses: actions/setup-python@v2
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
          cd ..
          pip install .

      - name: Run tests
        run: |
          cd margin_estimator_tool
          pytest ./test
